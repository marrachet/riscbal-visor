<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>RiscBal · Movimiento del terreno (EGMS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff;--fg:#1c2a33;--mut:#5d6c75;--line:#cfd8dd}
@media (prefers-color-scheme:dark){:root{--bg:#1d2a33;--fg:#e8eef2;--mut:#9fb0ba;--line:#3a4a54}}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#title{top:10px;left:56px;max-width:60%}#title b{font-size:15px}#title div{color:var(--mut);margin-top:2px}
#legend{bottom:24px;left:10px}
#bar{height:10px;width:180px;border-radius:5px;margin:5px 0 3px;background:linear-gradient(90deg,#d73027,#ffffbf,#4575b4)}
#lbl{display:flex;justify-content:space-between;color:var(--mut);font-size:11px}
#info{bottom:24px;right:10px;text-align:right;max-width:50%}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:450;pointer-events:none}
</style></head><body>
<div id="map"></div>
<div class="box" id="title"><b>RiscBal · Movimiento vertical del terreno</b><div id="meta">Cargando datos…</div></div>
<div class="box" id="legend">Velocidad (mm/año)<div id="bar"></div><div id="lbl"><span>−10 hundimiento</span><span>0</span><span>+10 elevación</span></div></div>
<div class="box" id="info"><span id="mode"></span><div id="sel" style="color:var(--mut)">Haz clic en un punto</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const map=L.map('map').setView([39.4,2.95],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
 attribution:'© OpenStreetMap · Datos: EGMS © Copernicus (Servicio de Vigilancia del Terreno)'}).addTo(map);
const cv=document.createElement('canvas');cv.id='cv';map.getContainer().appendChild(cv);const g=cv.getContext('2d');
const MX=lon=>(lon+180)/360, MY=lat=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2};
let N=0,X,Y,V,SD,vis=[],ALL=false,raf=0,dpr=1,W=0,H=0;
function lerp(a,b,t){return a+(b-a)*t}
function col(v){const t=(Math.max(-10,Math.min(10,v))+10)/20,A=[215,48,39],B=[255,255,191],C=[69,117,180];
 const [s,e,r]=t<.5?[A,B,t*2]:[B,C,(t-.5)*2];return `rgb(${[0,1,2].map(i=>Math.round(lerp(s[i],e[i],r))).join(',')})`}
function resize(){dpr=window.devicePixelRatio||1;const sz=map.getSize();W=sz.x;H=sz.y;cv.width=W*dpr;cv.height=H*dpr;draw()}
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
function render(){g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);vis=[];if(!N)return;
 const z=map.getZoom(),S=256*Math.pow(2,z),c=map.getCenter(),cx=MX(c.lng),cy=MY(c.lat);ALL=z>=15;
 let drawn=0;
 if(ALL){const r=Math.min(10,3+(z-15)*2.5);
  for(let i=0;i<N;i++){const px=(X[i]-cx)*S+W/2,py=(Y[i]-cy)*S+H/2;if(px<-12||py<-12||px>W+12||py>H+12)continue;
   g.fillStyle=col(V[i]);g.beginPath();g.arc(px,py,r,0,6.3);g.fill();vis.push([px,py,i]);drawn++}}
 else{const cell=46,gw=Math.ceil(W/cell)+1,gh=Math.ceil(H/cell)+1,n=new Float32Array(gw*gh),sx=new Float32Array(gw*gh),sy=new Float32Array(gw*gh),sv=new Float32Array(gw*gh);
  for(let i=0;i<N;i++){const px=(X[i]-cx)*S+W/2,py=(Y[i]-cy)*S+H/2;if(px<0||py<0||px>=W||py>=H)continue;
   const k=Math.floor(px/cell)+Math.floor(py/cell)*gw;n[k]++;sx[k]+=px;sy[k]+=py;sv[k]+=V[i]}
  for(let k=0;k<n.length;k++){if(!n[k])continue;const m=n[k],r=m==1?4:Math.min(22,9+Math.sqrt(m)*.9);
   g.globalAlpha=.9;g.fillStyle=col(sv[k]/m);g.beginPath();g.arc(sx[k]/m,sy[k]/m,r,0,6.3);g.fill();g.globalAlpha=1;g.strokeStyle='rgba(0,0,0,.35)';g.stroke();
   if(m>1&&r>=12){g.fillStyle='#111';g.font='600 11px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(m>=1000?(m/1000).toFixed(1)+'k':m,sx[k]/m,sy[k]/m)}drawn++}}
 document.getElementById('mode').textContent=ALL?`Puntos individuales (${drawn.toLocaleString('es')})`:`Agrupados en ${drawn.toLocaleString('es')} zonas · zoom ${z.toFixed(1)}`}
map.on('click',e=>{const el=document.getElementById('sel');if(!ALL){el.textContent='Acércate más (zoom 15) para ver puntos individuales';return}
 let b=null,bd=16;for(const q of vis){const d=Math.hypot(q[0]-e.containerPoint.x,q[1]-e.containerPoint.y);if(d<bd){bd=d;b=q}}
 el.textContent=b?`Velocidad vertical: ${V[b[2]].toFixed(1)} mm/año`+(SD[b[2]]?` (±${SD[b[2]].toFixed(1)})`:''):'Ningún punto aquí'});
map.on('move zoomend viewreset',draw);map.on('resize',resize);addEventListener('resize',resize);resize();
(async()=>{const m=document.getElementById('meta');
 try{const meta=await (await fetch('datos/meta.json',{cache:'no-cache'})).json();
  const buf=await (await fetch('datos/puntos.bin?v='+meta.generado)).arrayBuffer();const a=new Float32Array(buf);N=a.length/4;
  X=new Float64Array(N);Y=new Float64Array(N);V=new Float32Array(N);SD=new Float32Array(N);
  for(let i=0;i<N;i++){X[i]=MX(a[4*i]);Y[i]=MY(a[4*i+1]);V[i]=a[4*i+2];SD[i]=a[4*i+3]}
  m.textContent=`Illes Balears · EGMS ${meta.release} · ${N.toLocaleString('es')} puntos · actualizado ${meta.generado}`;draw()}
 catch(e){m.textContent='Aún no hay datos. Ejecuta la actualización en GitHub (pestaña Actions).'}})();
</script></body></html>
